[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "apeiron"
version = "0.0.0"
description = "Python SDK of Apeiron, a thin layer over its C ABI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apeiron = ["*.so", "*.dylib", "*.dll"]
