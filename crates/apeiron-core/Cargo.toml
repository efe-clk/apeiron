[package]
name = "apeiron-core-rs"
description = "Object model and storage engine for Apeiron"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "apeiron_core"

[dependencies]
apeiron-sys = { package = "apeiron-sys-rs", version = "0.1.0", path = "../apeiron-sys" }
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
blake3 = "1.8.7"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
data-encoding = "2.11.1"
fastcdc = "5.0.0"
fs4 = "1.1.0"
getrandom = "0.4.3"
minicbor = { version = "2.3.1", default-features = false, features = ["alloc"] }
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"
zstd = "0.14.3"

[dev-dependencies]
tempfile = "3.27.0"
