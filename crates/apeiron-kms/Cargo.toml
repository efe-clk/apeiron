[package]
name = "apeiron-kms-rs"
description = "Key management services and secret sharing for Apeiron's key files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "apeiron_kms"

[dependencies]
blake3 = "1.8.7"
cryptoki = "0.12.1"
data-encoding = "2.11.1"
getrandom = "0.4.3"
hmac = "0.13.0"
jiff = "0.2.38"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking"] }
serde_json = "1"
sha2 = "0.11.0"
thiserror = "2.0.21"
