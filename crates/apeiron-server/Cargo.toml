[package]
name = "apeiron-server"
description = "Local server of Apeiron's pages and JSON API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
apeiron = { path = "../apeiron" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
dirs = "6.0.0"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
