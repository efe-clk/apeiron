[package]
name = "apeiron-server"
description = "Server of Apeiron's pages and JSON API, local and on the web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
apeiron = { path = "../apeiron" }
apeiron-daemon = { path = "../apeiron-daemon" }
argon2 = "0.6.0"
aws-lc-rs = "1.19.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.23.1"
dirs = "6.0.0"
form_urlencoded = "1.2.2"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "service"] }
jiff = "0.2.38"
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "7.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
