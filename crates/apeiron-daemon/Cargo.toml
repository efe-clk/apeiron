[package]
name = "apeiron-daemon-rs"
description = "Background service of Apeiron: scheduled jobs and the restore test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "apeiron_daemon"

[dependencies]
apeiron = { package = "apeiron-rs", path = "../apeiron" }
apeiron-sys = { package = "apeiron-sys-rs", path = "../apeiron-sys" }
dirs = "6.0.0"
fs4 = "1.1.0"
jiff = { version = "0.2.38", features = ["serde"] }
notify = { version = "8.2.1", default-features = false, features = ["macos_fsevent"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
