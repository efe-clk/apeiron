[package]
name = "apeiron-git-rs"
description = "Git import and export for Apeiron"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "apeiron_git"

[dependencies]
apeiron-core = { package = "apeiron-core-rs", path = "../apeiron-core" }
flate2 = "1.1.10"
gix = { version = "0.85", default-features = false, features = ["sha1"] }
schemars = "1.2.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
