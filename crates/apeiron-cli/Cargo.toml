[package]
name = "apeiron-cli"
description = "The apeiron command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "apeiron"
path = "src/main.rs"

[dependencies]
apeiron = { path = "../apeiron" }
apeiron-daemon = { path = "../apeiron-daemon" }
apeiron-server = { path = "../apeiron-server" }
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
jiff = "0.2.38"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
