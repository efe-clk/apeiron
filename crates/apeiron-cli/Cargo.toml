[package]
name = "apeiron-cli-rs"
description = "The apeiron command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "apeiron"
path = "src/main.rs"

[dependencies]
apeiron = { package = "apeiron-rs", path = "../apeiron" }
apeiron-daemon = { package = "apeiron-daemon-rs", path = "../apeiron-daemon" }
apeiron-server = { package = "apeiron-server-rs", path = "../apeiron-server" }
aws-lc-rs = "1.19.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
dirs = "6.0.0"
jiff = "0.2.38"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "7.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
