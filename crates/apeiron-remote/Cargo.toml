[package]
name = "apeiron-remote-rs"
description = "SFTP and S3 remotes for Apeiron"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "apeiron_remote"

[dependencies]
apeiron-core = { package = "apeiron-core-rs", path = "../apeiron-core" }
russh = { version = "=0.65.2", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"
object_store = { version = "0.14.2", default-features = false, features = ["aws"] }
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
