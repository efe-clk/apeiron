[package]
name = "apeiron-remote"
description = "SFTP and S3 remotes for Apeiron"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
apeiron-core = { path = "../apeiron-core" }
russh = { version = "=0.63.1", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
thiserror = "2.0.21"
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3.27.0"
