[package]
name = "apeiron-services"
description = "Backup, restore, listing and diff for Apeiron"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
apeiron-core = { path = "../apeiron-core" }
serde = { version = "1.0.229", features = ["derive"] }
sevenz-rust2 = { version = "0.20.2", default-features = false, features = ["compress"] }
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
zip = { version = "7.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
