# Generates include/apeiron.h; the test `the_header_is_up_to_date` checks it.
language = "C"
include_guard = "APEIRON_H"
cpp_compat = true
documentation_style = "c99"
sys_includes = ["stdint.h"]
no_includes = true
header = "/* The C ABI of Apeiron (docs/SDK.md §2). Generated by cbindgen; do not edit. */"

[export]
include = ["apeiron_repo", "apeiron_job"]
