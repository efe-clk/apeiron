[package]
name = "apeiron"
description = "Public Rust API of Apeiron"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
apeiron-core = { path = "../apeiron-core" }
apeiron-git = { path = "../apeiron-git" }
apeiron-plugin = { path = "../apeiron-plugin" }
apeiron-remote = { path = "../apeiron-remote" }
apeiron-services = { path = "../apeiron-services" }
gethostname = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
apeiron-core = { path = "../apeiron-core" }
serde_json = "1"
tempfile = "3.27.0"
