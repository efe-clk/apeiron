# The text plugin of Apeiron (docs/TEXT.md): merges text files line by line
# and shows their differences. Build it with
#   cargo build --release --target wasm32-wasip2 --manifest-path plugins/text/Cargo.toml
# and install target/wasm32-wasip2/release/apeiron_text.wasm with
# `apeiron plugin add`.
[package]
name = "apeiron-text"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
diffy = "0.5.2"
wit-bindgen = "0.57.1"

# Built for WebAssembly on its own, not as part of the Apeiron workspace.
[workspace]
