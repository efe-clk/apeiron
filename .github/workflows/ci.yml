name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The desktop app's window uses WebKitGTK on Linux (docs/DESKTOP.md).
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      # The text plugin is a workspace of its own (docs/TEXT.md).
      - run: cargo fmt --manifest-path plugins/text/Cargo.toml --check
      - run: cargo clippy --manifest-path plugins/text/Cargo.toml --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # wasm32-wasip2 builds the fixture plugin of the plugin host's tests.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      # The SFTP tests start an OpenSSH server as the runner user.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssh-server libwebkit2gtk-4.1-dev && sudo mkdir -p /run/sshd
      - run: cargo test --all-targets
        env:
          APEIRON_SFTP_TEST: ${{ runner.os != 'Windows' && '1' || '' }}
      - run: cargo test --manifest-path plugins/text/Cargo.toml
      # The C ABI through the Python SDK and a C program (docs/SDK.md).
      - run: cargo build -p apeiron-ffi
      - name: Python SDK and C example
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) lib=apeiron.dll; python=python ;;
            macOS) lib=libapeiron.dylib; python=python3 ;;
            *) lib=libapeiron.so; python=python3 ;;
          esac
          APEIRON_LIB="target/debug/$lib" $python -m unittest discover -s sdk/python/tests -v
          if [ "$RUNNER_OS" != Windows ]; then
            mkdir -p target/c/src && echo hello > target/c/src/a.txt && rm -rf target/c/repo
            cc -std=c99 -Wall -Wextra -Werror -I crates/apeiron-ffi/include sdk/c/example.c \
              -L target/debug -lapeiron -Wl,-rpath,"$PWD/target/debug" -o target/c/example
            target/c/example "$PWD/target/c/repo" "$PWD/target/c/src"
          fi

  # S3 remotes against LocalStack, an S3-compatible service with conditional writes.
  s3:
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:4.9
        env:
          SERVICES: s3
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4566/_localstack/health && break; sleep 2; done
          curl -sf -X PUT http://127.0.0.1:4566/apeiron-test
      - run: cargo test -p apeiron-remote --test s3 -- --nocapture
        env:
          APEIRON_S3_TEST_URL: s3://apeiron-test?endpoint=http://127.0.0.1:4566&region=us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
