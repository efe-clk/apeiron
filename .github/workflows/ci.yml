name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # The SFTP tests start an OpenSSH server as the runner user.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y openssh-server && sudo mkdir -p /run/sshd
      - run: cargo test --all-targets
        env:
          APEIRON_SFTP_TEST: ${{ runner.os != 'Windows' && '1' || '' }}

  # S3 remotes against LocalStack, an S3-compatible service with conditional writes.
  s3:
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:4.9
        env:
          SERVICES: s3
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4566/_localstack/health && break; sleep 2; done
          curl -sf -X PUT http://127.0.0.1:4566/apeiron-test
      - run: cargo test -p apeiron-remote --test s3 -- --nocapture
        env:
          APEIRON_S3_TEST_URL: s3://apeiron-test?endpoint=http://127.0.0.1:4566&region=us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
